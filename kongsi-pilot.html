<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kongsi — Tagihan Rumah Tangga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root{
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --ink:#FFFFFF; --ink-soft:#98989D; --ink-faint:#636366;
    --primary:#0A84FF; --primary-dark:#409CFF; --primary-tint:rgba(10,132,255,0.16);
    --gold:#FF9F0A; --gold-tint:rgba(255,159,10,0.16); --success:#32D74B; --success-tint:rgba(50,215,75,0.16);
    --danger:#FF453A; --danger-tint:rgba(255,69,58,0.16); --border:#38383A;
    --cat-air:#64D2FF; --cat-wifi:#BF5AF2; --cat-cicilan:#8E8E93;
    --cat-air-tint:rgba(100,210,255,0.16); --cat-wifi-tint:rgba(191,90,242,0.16); --cat-cicilan-tint:rgba(142,142,147,0.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;}
  .app{max-width:520px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-0.02em;}
  h2{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  p{color:var(--ink-soft);font-size:14px;}
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .brand .mark{width:10px;height:10px;border-radius:3px;background:var(--primary);display:inline-block;}
  .tagline{font-size:13px;color:var(--ink-faint);margin-bottom:28px;}
  .card{background:var(--surface);border:none;border-radius:14px;padding:20px;margin-bottom:16px;position:relative;}
  .field{margin-bottom:16px;position:relative;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface2);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  .field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
  .field .error{font-size:12px;color:var(--danger);margin-top:5px;}
  .checkgroup{display:flex;flex-wrap:wrap;gap:8px;}
  .check-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;background:var(--surface2);}
  .check-pill.active{background:var(--primary-tint);border-color:var(--primary);color:var(--primary-dark);font-weight:700;}
  button{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:12px;border:none;padding:13px 18px;transition:opacity .15s, background .2s;}
  button:hover{opacity:.9;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--primary);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-secondary{background:var(--surface2);color:var(--ink);border:none;width:100%;}
  .btn-ghost{background:transparent;color:var(--primary);padding:8px 4px;font-size:14px;border:none;}
  .btn-small{padding:9px 12px;font-size:13px;width:auto;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;min-width:0;}
  .home-choices{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .choice-card{background:var(--surface);border:none;border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;}
  .choice-card:active{background:var(--surface2);}
  .choice-icon{width:40px;height:40px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .choice-body{flex:1;}
  .choice-card .ct{font-size:15px;font-weight:700;margin-bottom:2px;}
  .choice-card .cd{font-size:12.5px;color:var(--ink-soft);}
  .choice-chevron{color:var(--ink-faint);flex-shrink:0;}
  .recent-table{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:22px;}
  .recent-row{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
  .recent-row:last-child{border-bottom:none;}
  .recent-row:active{background:var(--surface2);}
  .recent-icon{width:28px;height:28px;border-radius:14px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .recent-name{flex:1;font-size:14px;font-weight:600;color:var(--ink);}
  .recent-code{font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:0.05em;background:var(--surface2);padding:3px 8px;border-radius:6px;}
  .home-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .home-topbar .acc-email{font-size:12px;color:var(--ink-faint);}
  .logout-link{font-size:12.5px;color:var(--danger);cursor:pointer;font-weight:700;}
  .user-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);background:var(--surface2);padding:5px 10px 5px 5px;border-radius:20px;}
  .avatar-circle{width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex-shrink:0;}
  .logo-mark{position:relative;width:22px;height:16px;flex-shrink:0;}
  .logo-mark span{position:absolute;width:14px;height:14px;border-radius:50%;top:1px;}
  .logo-mark span.c1{background:var(--primary);left:0;}
  .logo-mark span.c2{background:var(--gold);left:8px;opacity:0.85;}
  .section-label{font-size:11.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
  .code-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);color:var(--ink);padding:7px 10px 7px 13px;border-radius:20px;font-weight:700;font-size:15px;letter-spacing:0.04em;cursor:pointer;border:none;}
  .code-pill svg{opacity:.65;flex-shrink:0;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .top-bar .back{font-size:15px;color:var(--primary);cursor:pointer;}
  .group-header{text-align:center;margin-bottom:18px;}
  .group-header .gicon{width:64px;height:64px;border-radius:32px;background:var(--primary);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .group-header h1{font-size:22px;margin-bottom:2px;}
  .group-header p{font-size:12.5px;}
  .seg-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:18px;}
  .seg-tab{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .seg-tab.active{background:var(--surface);color:var(--ink);}
  .summary-hero{background:transparent;color:var(--ink);border-radius:0;padding:0;margin-bottom:20px;}
  .summary-hero .slabel{font-size:12px;color:var(--ink-faint);margin-bottom:4px;}
  .summary-hero .stotal{font-size:24px;font-weight:800;margin-bottom:12px;}
  .contrib-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink-soft);}
  .bill-item{border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;position:relative;}
  .bill-item:last-child{border-bottom:1px solid var(--border);}
  .bill-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0;}
  .bill-name{font-size:15px;font-weight:600;}
  .bill-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .status-badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .status-paid{background:var(--success-tint);color:var(--success);}
  .status-unpaid{background:var(--gold-tint);color:var(--gold);}
  .status-overdue{background:var(--danger-tint);color:var(--danger);}
  .split-list{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .split-row{display:flex;flex-direction:column;gap:4px;padding:6px 0;font-size:13px;}
  .split-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .split-row .sname{display:flex;align-items:center;gap:6px;flex:1;}
  .settle-toggle{font-size:12px;font-weight:700;padding:4px 10px;border-radius:16px;border:none;background:var(--surface2);cursor:pointer;white-space:nowrap;}
  .settle-toggle.on{background:var(--success-tint);color:var(--success);}
  .settle-toggle.review{background:var(--gold-tint);color:var(--gold);}
  .proof-link{font-size:12px;color:var(--primary);cursor:pointer;background:none;border:none;padding:0;font-weight:700;text-align:left;}
  .proof-img{max-width:100%;max-height:220px;border-radius:8px;margin-top:6px;display:block;}
  .empty-note{font-size:13px;color:var(--ink-faint);text-align:center;padding:20px 0;}
  .reminder-box{background:var(--surface2);border:none;border-radius:10px;padding:12px;font-size:13px;margin-top:10px;white-space:pre-wrap;}
  .type-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .type-toggle button{flex:1;background:var(--surface2);border:none;color:var(--ink-soft);padding:10px 6px;font-size:13px;}
  .type-toggle button.active{background:var(--primary-tint);color:var(--primary-dark);}
  .edit-nominal-link{font-size:12px;color:var(--primary);cursor:pointer;font-weight:700;margin-top:4px;display:inline-block;}
  .edit-nominal-box{margin-top:8px;padding:10px;background:var(--surface2);border:none;border-radius:10px;}
  .date-picker-wrap{position:relative;}
  .date-picker-btn{width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:inherit;font-size:15px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;}
  .date-picker-btn .ph{color:var(--ink-faint);}
  .date-picker-panel{position:absolute;bottom:calc(100% + 6px);left:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:20;width:230px;}
  .date-num{padding:7px 0;text-align:center;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink);}
  .date-num:hover{background:var(--primary-tint);}
  .date-num.selected{background:var(--primary);color:#fff;font-weight:700;}
  .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .checkmark-pop{display:inline-flex;align-items:center;justify-content:center;}
  .add-bill-btn{width:100%;background:var(--surface);border:none;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--primary);font-weight:700;font-size:14px;margin-bottom:16px;cursor:pointer;}
  .add-bill-btn:active{background:var(--surface2);}
  .chart-bar-label{font-size:10px;fill:var(--ink-faint);}
  .chart-bar-value{font-size:10px;font-weight:700;fill:var(--ink);}
  .cat-icon{width:34px;height:34px;border-radius:17px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .bill-top-flex{display:flex;align-items:center;gap:10px;}
  .owe-card{background:var(--surface);border:none;border-radius:14px;padding:6px 16px;margin-bottom:16px;}
  .owe-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .owe-row:last-child{border-bottom:none;}
  .owe-clear{color:var(--success);font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;}
  .owe-pending{color:var(--danger);font-weight:700;font-size:13px;}
  .owe-detail{padding:0 0 10px 0;font-size:12px;color:var(--ink-faint);display:none;}
  .owe-detail div{padding:2px 0;}
  .cat-icon{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .bill-kebab{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:pointer;flex-shrink:0;background:none;border:none;padding:0;font-size:18px;}
  .bill-kebab:hover{background:var(--surface2);}
  .kebab-menu{position:absolute;right:0;top:34px;background:var(--surface2);border-radius:12px;padding:6px;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,0.5);min-width:150px;}
  .kebab-item{padding:9px 12px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--ink);}
  .kebab-item:hover{background:var(--bg);}
  .kebab-item.danger{color:var(--danger);}
  .confirm-box{margin-top:10px;padding:12px;background:var(--surface2);border-radius:10px;}
  .confirm-box p{color:var(--ink);font-size:13px;margin-bottom:10px;}
  .confirm-box .warn{color:var(--gold);font-weight:600;}
  .date-row{display:flex;gap:8px;}
  .date-row input, .date-row select{padding:11px 8px;text-align:center;}
  .awaiting-note{font-size:11px;color:var(--gold);margin-top:2px;}
  .toggle-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;margin-bottom:12px;}
  .toggle-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .toggle-box.on{background:var(--primary);border-color:var(--primary);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const app = document.getElementById('app');
let state = {
  view: 'register', groupCode: null, group: null, currentUser: null,
  joinError: '', loginError: '', createErrors: {},
  createMembers: [{ name: '', email: '' }, { name: '', email: '' }], createDraftName: '', createDraftPin: '',
  newBillType: 'single', newBillSplit: [],
  newBillDraft: { name: '', amount: '', dueDay: '', dueMonth: '', dueYear: '', responsible: '', tenor: '', paidCount: '', category: '', lender: '', totalMode: false },
  recentGroups: [],
  datePanelOpen: false,
  groupTab: 'tagihan',
  expandedBills: [],
  openKebab: null,
  registerErrors: {}, pendingAccount: null, otpError: '',
  accountEmail: '', accountLoginError: ''
};

function render() {
  if (state.view === 'storageError') return renderStorageError();
  if (state.view === 'register') return renderRegister();
  if (state.view === 'otp') return renderOtp();
  if (state.view === 'accountLogin') return renderAccountLogin();
  if (state.view === 'home') return renderHome();
  if (state.view === 'create') return renderCreate();
  if (state.view === 'join') return renderJoin();
  if (state.view === 'login') return renderLogin();
  if (state.view === 'group') return renderGroup();
  if (state.view === 'addBill') return renderAddBill();
}
function setState(patch) { state = { ...state, ...patch }; render(); }

// ---------- Helpers ----------
function toTitleCase(str) { return str.split(' ').map(w => w.length ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' '); }
function applyTitleCaseLive(el) { const pos = el.selectionStart; el.value = toTitleCase(el.value); try { el.setSelectionRange(pos, pos); } catch (e) {} }
function applyRupiahLive(el) { const digits = el.value.replace(/[^0-9]/g, ''); el.value = digits ? 'Rp.' + Number(digits).toLocaleString('id-ID') : ''; el.setSelectionRange(el.value.length, el.value.length); }
function parseRupiah(value) { const digits = (value || '').replace(/[^0-9]/g, ''); return digits ? parseInt(digits, 10) : 0; }
function formatRp(n) { return 'Rp.' + Math.round(n || 0).toLocaleString('id-ID'); }

async function loadGroup(code) {
  try { const res = await window.storage.get('kongsi:' + code, true); return res ? JSON.parse(res.value) : null; }
  catch (e) { return null; }
}
async function saveGroup(code, data) {
  try { await window.storage.set('kongsi:' + code, JSON.stringify(data), true); return true; }
  catch (e) { console.error(e); return false; }
}
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function loadAccountByEmail(email) {
  try { const res = await window.storage.get('kongsi:acct:' + email.toLowerCase(), true); return res ? JSON.parse(res.value) : null; }
  catch (e) { return null; }
}
async function saveAccount(acc) {
  try { await window.storage.set('kongsi:acct:' + acc.email.toLowerCase(), JSON.stringify(acc), true); return { ok: true }; }
  catch (e) { return { ok: false, error: (e && e.message) ? e.message : String(e) }; }
}
async function loadRecentGroups(email) {
  try { const res = await window.storage.get('kongsi:recent:' + email.toLowerCase(), true); return res ? JSON.parse(res.value) : []; }
  catch (e) { return []; }
}
async function saveRecentGroups(email, list) {
  try { await window.storage.set('kongsi:recent:' + email.toLowerCase(), JSON.stringify(list), true); } catch (e) {}
}
function addToRecent(code, name) {
  if (!state.accountEmail) return;
  const filtered = state.recentGroups.filter(r => r.code !== code);
  const updated = [{ code, name }, ...filtered].slice(0, 5);
  state.recentGroups = updated;
  saveRecentGroups(state.accountEmail, updated);
}
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = ''; for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function currentMonthKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel() {
  const names = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const d = new Date(); return names[d.getMonth()] + ' ' + d.getFullYear();
}
function daysStatus(dueDay) {
  const now = new Date();
  const due = new Date(now.getFullYear(), now.getMonth(), dueDay);
  const diff = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
  if (diff < 0) return { text: `Telat ${Math.abs(diff)} hari`, overdue: true };
  if (diff === 0) return { text: 'Jatuh tempo hari ini', overdue: false };
  return { text: `H-${diff}`, overdue: false };
}
function resizeImageFile(file, maxWidth, quality) {
  maxWidth = maxWidth || 900; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function readProofImage(base64, mediaType) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 300,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType || 'image/jpeg', data: base64 } },
          { type: 'text', text: 'Ini screenshot bukti transfer bank/e-wallet Indonesia. Baca nominal yang ditransfer. Jawab HANYA dalam format JSON tanpa teks lain: {"amount": angka_tanpa_titik_koma_atau_null}' }
        ]
      }]
    })
  });
  const data = await response.json();
  const text = (data.content || []).map(c => c.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  return { amount: parsed.amount ? Number(parsed.amount) : null };
}

// ---------- Storage unavailable notice ----------
function renderStorageError() {
  app.innerHTML = `
    <div class="brand"><span class="logo-mark"><span class="c1"></span><span class="c2"></span></span><h1>Kongsi</h1></div>
    <div class="card" style="background:var(--danger-tint);border-color:var(--danger-tint);">
      <p style="color:var(--danger);font-weight:700;font-size:13px;margin-bottom:6px;">Penyimpanan tidak tersedia</p>
      <p style="color:var(--ink-soft);font-size:13.5px;">Halaman ini butuh dibuka lewat pratinjau file di dalam chat Claude, karena pakai fitur penyimpanan bawaan yang tidak aktif kalau file-nya didownload dan dibuka terpisah di browser. Coba buka lagi lewat tombol/link file di percakapan, jangan lewat file yang sudah didownload ke folder.</p>
    </div>
  `;
}

// ---------- Register ----------
function renderRegister() {
  app.innerHTML = `
    <div class="brand"><span class="logo-mark"><span class="c1"></span><span class="c2"></span></span><h1>Kongsi</h1></div>
    <p class="tagline">Buat akun buat mulai pakai Kongsi.</p>
    <div class="card stack">
      <div class="field">
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="nama@email.com" value="${state.regDraftEmail || ''}">
        ${state.registerErrors.email ? `<div class="error">${state.registerErrors.email}</div>` : ''}
      </div>
      <div class="field">
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="Minimal 6 karakter">
        ${state.registerErrors.password ? `<div class="error">${state.registerErrors.password}</div>` : ''}
      </div>
      <div class="field">
        <label>Nomor WhatsApp</label>
        <input id="regWa" type="tel" placeholder="08123456789" value="${state.regDraftWa || ''}">
        ${state.registerErrors.wa ? `<div class="error">${state.registerErrors.wa}</div>` : ''}
      </div>
      <button class="btn-primary" id="btnRegister" disabled>Daftar</button>
      <div id="registerSubmitError"></div>
    </div>
    <p style="text-align:center;margin-top:14px;">Sudah punya akun? <span style="color:var(--primary);font-weight:700;cursor:pointer;" id="goLogin">Masuk</span></p>
  `;
  const regEmail = document.getElementById('regEmail');
  const regPassword = document.getElementById('regPassword');
  const regWa = document.getElementById('regWa');
  const btnRegister = document.getElementById('btnRegister');

  function checkRegisterValid() {
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(regEmail.value.trim());
    const passOk = regPassword.value.length >= 6;
    const waOk = /^0\d{9,13}$/.test(regWa.value.trim());
    btnRegister.disabled = !(emailOk && passOk && waOk);
  }
  regEmail.oninput = () => { state.regDraftEmail = regEmail.value; checkRegisterValid(); };
  regWa.oninput = () => { state.regDraftWa = regWa.value; checkRegisterValid(); };
  regPassword.oninput = () => { checkRegisterValid(); };
  regEmail.focus();
  checkRegisterValid();
  document.getElementById('goLogin').onclick = () => setState({ view: 'accountLogin', accountLoginError: '' });

  regWa.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('btnRegister').click(); };
  regPassword.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('btnRegister').click(); };

  document.getElementById('btnRegister').onclick = async (e) => {
    const btn = e.target;
    const email = regEmail.value.trim().toLowerCase();
    const password = document.getElementById('regPassword').value;
    const wa = regWa.value.trim();
    const errors = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'Masukkan email yang valid.';
    if (password.length < 6) errors.password = 'Password minimal 6 karakter.';
    if (!/^0\d{9,13}$/.test(wa)) errors.wa = 'Masukkan nomor WhatsApp yang valid, contoh 08123456789.';
    if (Object.keys(errors).length) { setState({ registerErrors: errors }); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Memeriksa email...';
    const existing = await loadAccountByEmail(email);
    if (existing) {
      btn.disabled = false; btn.innerHTML = 'Daftar';
      setState({ registerErrors: { email: 'Email ini sudah terdaftar. Silakan masuk.' } });
      return;
    }
    btn.innerHTML = '<span class="spinner"></span> Mendaftarkan...';
    const passwordHash = await sha256(password);
    const otp = String(Math.floor(100000 + Math.random() * 900000));
    state.pendingAccount = { email, passwordHash, wa, otp };
    await new Promise(r => setTimeout(r, 500));
    setState({ view: 'otp', registerErrors: {} });
  };
}

// ---------- Custom date picker (used in add bill form) ----------
function attachDatePicker(wrapId, initialVal, onSelect) {
  const wrap = document.getElementById(wrapId);
  const btn = wrap.querySelector('.date-picker-btn');
  const panel = wrap.querySelector('.date-picker-panel');
  let open = false;
  function closePanel() { panel.style.display = 'none'; open = false; document.removeEventListener('click', outsideClick); }
  function outsideClick(e) { if (!wrap.contains(e.target)) closePanel(); }
  btn.onclick = (e) => {
    e.stopPropagation();
    open = !open;
    panel.style.display = open ? 'grid' : 'none';
    if (open) setTimeout(() => document.addEventListener('click', outsideClick), 0);
  };
  panel.querySelectorAll('.date-num').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      onSelect(el.dataset.day);
      closePanel();
    };
  });
}

const CATEGORY_LIST = ['Listrik', 'Air', 'WiFi', 'Tagihan Rumah', 'Cicilan', 'Lainnya'];
const CATEGORY_COLORS = {
  'Listrik': 'var(--primary)',
  'Air': 'var(--cat-air)',
  'WiFi': 'var(--cat-wifi)',
  'Tagihan Rumah': 'var(--gold)',

  'Lainnya': 'var(--ink-faint)'
};
const CATEGORY_ICONS = {
  'Listrik': '⚡',
  'Air': '💧',
  'WiFi': '📶',
  'Tagihan Rumah': '🏠',
  'Cicilan': '💳',
  'Lainnya': '📄'
};
const CATEGORY_TINTS = {
  'Listrik': 'var(--primary-tint)',
  'Air': 'var(--cat-air-tint)',
  'WiFi': 'var(--cat-wifi-tint)',
  'Tagihan Rumah': 'var(--gold-tint)',
  'Cicilan': 'var(--cat-cicilan-tint)',
  'Lainnya': 'rgba(255,255,255,0.08)'
};
function formatDateTime(ts) {
  const d = new Date(ts);
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${hh}:${mm}`;
}
function monthKeyLabel(key) {
  const [y, m] = key.split('-');
  const names = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return names[parseInt(m, 10) - 1] + ' ' + y.slice(2);
}
function formatShort(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'jt';
  if (n >= 1000) return Math.round(n / 1000) + 'rb';
  return String(Math.round(n));
}
function computeMonthlyCategoryTotals(g) {
  return Object.keys(g.monthly).sort().map(k => {
    const byCat = {};
    CATEGORY_LIST.forEach(c => byCat[c] = 0);
    Object.keys(g.monthly[k]).forEach(billId => {
      const bill = g.bills.find(b => b.id === billId);
      if (!bill) return;
      const rec = g.monthly[k][billId];
      const amt = rec.amount || bill.estimate;
      const cat = bill.category && CATEGORY_LIST.includes(bill.category) ? bill.category : 'Lainnya';
      byCat[cat] += amt;
    });
    const total = Object.values(byCat).reduce((a, b) => a + b, 0);
    return { key: k, label: monthKeyLabel(k), total, byCat };
  });
}
function renderTrendChart(g) {
  const data = computeMonthlyCategoryTotals(g);
  if (data.length < 2) return '<div class="empty-note">Grafik akan muncul setelah ada data dari 2 bulan atau lebih.</div>';
  const max = Math.max(...data.map(d => d.total), 1);
  const barW = 46, gap = 16, chartH = 110;
  const svgW = data.length * (barW + gap) + gap;
  const bars = data.map((d, i) => {
    const x = gap + i * (barW + gap);
    let cursorY = chartH;
    const segs = CATEGORY_LIST.map(cat => {
      const val = d.byCat[cat];
      if (!val) return '';
      const segH = (val / max) * chartH;
      cursorY -= segH;
      return `<rect x="${x}" y="${cursorY}" width="${barW}" height="${segH}" fill="${CATEGORY_COLORS[cat]}"></rect>`;
    }).join('');
    return `
      <text class="chart-bar-value" x="${x + barW/2}" y="${chartH - (d.total/max)*chartH - 6}" text-anchor="middle">${formatShort(d.total)}</text>
      ${segs}
      <text class="chart-bar-label" x="${x + barW/2}" y="${chartH + 18}" text-anchor="middle">${d.label}</text>
    `;
  }).join('');
  const legend = CATEGORY_LIST.map(cat => `
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);margin-right:10px;">
      <span style="width:9px;height:9px;border-radius:3px;background:${CATEGORY_COLORS[cat]};display:inline-block;"></span>${cat}
    </span>
  `).join('');
  return `
    <svg width="100%" viewBox="0 0 ${svgW} ${chartH + 30}" style="overflow:visible;">${bars}</svg>
    <div style="margin-top:10px;">${legend}</div>
  `;
}
function buildExportRows(g) {
  const rows = [];
  Object.keys(g.monthly).sort().forEach(monthKey => {
    Object.keys(g.monthly[monthKey]).forEach(billId => {
      const bill = g.bills.find(b => b.id === billId);
      if (!bill) return;
      const rec = g.monthly[monthKey][billId];
      const amt = rec.amount || bill.estimate;
      rows.push({
        Bulan: monthKeyLabel(monthKey),
        Tagihan: bill.name,
        Kategori: bill.category || 'Lainnya',
        Nominal: amt,
        Tipe: (bill.type === 'single' ? 'Satu orang' : 'Dibagi rata') + (bill.tenor ? ' (Cicilan)' : '')
      });
    });
  });
  return rows;
}

// ---------- Group dashboard ----------
function getMonthRecord(g, monthKey, billId) {
  if (!g.monthly[monthKey]) g.monthly[monthKey] = {};
  if (!g.monthly[monthKey][billId]) g.monthly[monthKey][billId] = { amount: null, payments: {} };
  return g.monthly[monthKey][billId];
}
function isInstallmentDone(bill) { return !!bill.tenor && (bill.paidCount || 0) >= bill.tenor; }
function requiredMembers(bill) {
  if (isInstallmentDone(bill)) return [];
  if (bill.type === 'single') return [bill.responsible];
  return bill.splitMembers.filter(m => m !== bill.responsible);
}
function maybeAdvanceInstallment(bill, rec) {
  if (!bill.tenor) return;
  const req = bill.type === 'single' ? [bill.responsible] : bill.splitMembers.filter(m => m !== bill.responsible);
  const allPaidNow = req.every(m => (rec.payments[m] || {}).status === 'paid');
  if (allPaidNow) bill.paidCount = (bill.paidCount || 0) + 1;
}

          const amt = owed[m.name] || 0;
          if (amt <= 0 && !hasReq[m.name]) {
            return `<div class="owe-row" style="cursor:default;"><span>${m.name}</span><span style="color:var(--ink-faint);font-size:13px;">Belum ada tagihan</span></div>`;
          }
          if (amt <= 0) {
            return `<div class="owe-row" style="cursor:default;"><span>${m.name}</span><span class="owe-clear">✓ Lunas</span></div>`;
          }
          return `
            <div class="owe-row" data-owetoggle="${m.name}">
              <span>${m.name}</span>
              <span class="owe-pending">Belum bayar ${formatRp(amt)}</span>
            </div>
            <div class="owe-detail" id="owedetail-${m.name}">
              ${owedDetail[m.name].map(d => `<div>${d.name} — ${formatRp(d.amount)}</div>`).join('')}
            </div>
          `;
        }).join('')}
      </div>

      <div class="card">
        <h2 style="margin-bottom:4px;">Tren pengeluaran bulanan</h2>
        <p style="margin-bottom:10px;">Total tagihan rumah tangga tiap bulan, per kategori.</p>
        ${renderTrendChart(g)}
        <div style="margin-top:14px;display:flex;gap:8px;">
          <button class="btn-secondary btn-small" id="btnExportExcel">Export ke Excel</button>
          <button class="btn-secondary btn-small" id="btnExportPdf">Export ke PDF</button>
        </div>
        <div id="exportStatus"></div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:6px;">Pengingat</h2>
        <p style="margin-bottom:10px;">Buat teks pengingat untuk tagihan yang belum lunas.</p>
        <button class="btn-secondary btn-small" id="btnReminder">Buat teks pengingat</button>
        <div id="reminderOut"></div>
      </div>
    </div>
  `;
  document.getElementById('back').onclick = () => setState({ view: 'home', currentUser: null });
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => setState({ groupTab: el.dataset.tab });
  });
  document.getElementById('btnAddBillNav').onclick = () => setState({ view: 'addBill', createErrors: {}, newBillType: 'single', newBillSplit: [], newBillDraft: { name: '', amount: '', dueDay: '', dueMonth: '', dueYear: '', responsible: '', tenor: '', paidCount: '', category: '', lender: '', totalMode: false } });
  document.getElementById('codePillBtn').onclick = () => {
    navigator.clipboard.writeText(code);
    const icon = document.getElementById('copyIcon');
    icon.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
    setTimeout(() => { icon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'; }, 1200);
  };
  document.querySelectorAll('[data-owetoggle]').forEach(el => {
    el.onclick = () => {
      const detail = document.getElementById('owedetail-' + el.dataset.owetoggle);
      detail.style.display = detail.style.display === 'block' ? 'none' : 'block';
    };
  });

  const billList = document.getElementById('billList');
  if (!g.bills.length) {
    billList.innerHTML = '<div class="empty-note">Belum ada tagihan. Tambahkan tagihan pertama.</div>';
  } else {
    billList.innerHTML = g.bills.map(b => {
      const rec = getMonthRecord(g, monthKey, b.id);
      const req = requiredMembers(b);
      const done = isInstallmentDone(b);
      const allPaid = done || req.every(m => (rec.payments[m] || {}).status === 'paid');
      const ds = daysStatus(b.dueDay);
      let badge;
      if (done) badge = `<span class="status-badge status-paid">Cicilan lunas</span>`;
      else if (allPaid) badge = '<span class="status-badge status-paid">Lunas</span>';
      else if (ds.overdue) badge = `<span class="status-badge status-overdue">${ds.text}</span>`;
      else badge = `<span class="status-badge status-unpaid">${ds.text}</span>`;

      let metaText = `Jatuh tempo tgl ${b.dueDay}`;
      if (b.dueMonth && b.dueYear) metaText += ` (mulai ${MONTH_NAMES_FULL[b.dueMonth-1].slice(0,3)} ${b.dueYear})`;
      if (b.tenor) {
        metaText += done ? ` · Cicilan lunas (${b.tenor}/${b.tenor})` : ` · Cicilan ke-${(b.paidCount||0)+1} dari ${b.tenor}`;
        metaText += b.type === 'single' ? ` · PJ: ${b.responsible}` : ` · Dibagi rata, transfer ke ${b.responsible}`;
      } else {
        metaText += b.type === 'single' ? ` · PJ: ${b.responsible}` : ` · Dibagi rata`;
      }
      if (b.lender) metaText += ` · Pinjaman dari ${b.lender}`;
      if (b.installmentTotal) metaText += ` · Total ${formatRp(b.installmentTotal)}`;

      const canEdit = state.currentUser === b.responsible;
      const amt = rec.amount || b.estimate;
      const isExpanded = state.expandedBills.includes(b.id);

      let rowsHtml = '';
      if (done) {
        rowsHtml = `<div class="empty-note" style="padding:6px 0;">Semua cicilan sudah lunas.</div>`;
      } else if (b.type === 'split') {
        const share = amt / b.splitMembers.length;
        rowsHtml += `<div class="split-row"><div class="split-row-top"><span class="sname">${b.responsible} (menalangi ke penyedia jasa) · ${formatRp(share)}</span></div></div>`;
        rowsHtml += req.map(m => renderMemberRow(g, b, rec, m, share)).join('');
      } else {
        rowsHtml = req.map(m => renderMemberRow(g, b, rec, m, amt)).join('');
        if (b.tenor && b.tenor - (b.paidCount || 0) > 1) {
          const remaining = b.tenor - (b.paidCount || 0);
          const remainingAmount = remaining * amt;
          rowsHtml += `
            <div class="split-row" style="border-top:1px dashed var(--border);padding-top:10px;margin-top:4px;">
              <div class="split-row-top">
                <span class="sname">Lunasi sisa ${remaining}x sekaligus · ${formatRp(remainingAmount)}</span>
                <label class="settle-toggle" style="cursor:pointer;">Upload bukti pelunasan<input type="file" accept="image/*" data-payoff="${b.id}" style="display:none;"></label>
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="bill-item">
          <div class="bill-top bill-top-flex" data-toggle="${b.id}" style="cursor:pointer;">
            <span class="cat-icon" style="background:${CATEGORY_TINTS[b.category] || 'rgba(255,255,255,0.08)'};color:${CATEGORY_COLORS[b.category] || 'var(--ink-faint)'};">${CATEGORY_ICONS[b.category] || '📄'}</span>
            <div style="flex:1;">
              <div class="bill-name">${b.name}</div>
              <div class="bill-meta">${metaText}</div>
              ${canEdit ? `<span class="edit-nominal-link" data-editbill="${b.id}">Edit nominal</span>` : ''}
              <div id="editBox-${b.id}"></div>
            </div>
            <span style="display:flex;align-items:center;gap:6px;">
              ${badge}
              <svg id="chev-${b.id}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink-faint);transition:transform .15s;transform:${isExpanded ? 'rotate(90deg)' : ''};"><path d="M9 6l6 6-6 6"/></svg>
            </span>
          </div>
          <div class="split-list" id="body-${b.id}" style="display:${isExpanded ? 'block' : 'none'};">${rowsHtml}</div>
        </div>
      `;
    }).join('');

    // Toggle expand/collapse per bill
    billList.querySelectorAll('[data-toggle]').forEach(el => {
      el.onclick = (e) => {
        if (e.target.closest('[data-editbill]') || e.target.closest('#editBox-' + el.dataset.toggle)) return;
        const billId = el.dataset.toggle;
        const isOpen = state.expandedBills.includes(billId);
        setState({ expandedBills: isOpen ? state.expandedBills.filter(x => x !== billId) : [...state.expandedBills, billId] });
      };
    });

    // Early payoff upload (single-type installment only)
    billList.querySelectorAll('[data-payoff]').forEach(fileEl => {
      fileEl.onchange = async () => {
        const file = fileEl.files[0];
        if (!file) return;
        const billId = fileEl.dataset.payoff;
        const label = fileEl.closest('.settle-toggle');
        label.textContent = 'Membaca...';
        try {
          const dataUrl = await resizeImageFile(file);
          const base64 = dataUrl.split(',')[1];
          const bill = g.bills.find(x => x.id === billId);
          const rec = getMonthRecord(g, monthKey, billId);
          const remaining = bill.tenor - (bill.paidCount || 0);
          const expected = remaining * (rec.amount || bill.estimate);
          const result = await readProofImage(base64, 'image/jpeg');
          const matched = result.amount && Math.abs(result.amount - expected) < 1000;
          if (matched) {
            bill.paidCount = bill.tenor;
            rec.payments[bill.responsible] = { status: 'paid', amount: result.amount, uploadedAt: Date.now(), proofImage: dataUrl };
            const ok = await saveGroup(code, g);
            if (ok) setState({ group: g, expandedBills: [...new Set([...state.expandedBills, billId])] });
          } else {
            label.textContent = `Terbaca ${result.amount ? formatRp(result.amount) : 'tidak jelas'}, beda dari sisa ${formatRp(expected)}. Coba lagi.`;
          }
        } catch (err) {
          label.textContent = 'Gagal baca, coba lagi';
        }
      };
    });

    // Upload handlers
    billList.querySelectorAll('[data-upload]').forEach(fileEl => {
      fileEl.onchange = async () => {
        const file = fileEl.files[0];
        if (!file) return;
        const [billId, member] = fileEl.dataset.upload.split('|');
        const label = fileEl.closest('.settle-toggle');
        label.textContent = 'Membaca...';
        try {
          const dataUrl = await resizeImageFile(file);
          const base64 = dataUrl.split(',')[1];
          const bill = g.bills.find(x => x.id === billId);
          const rec = getMonthRecord(g, monthKey, billId);
          const denom = bill.type === 'split' ? bill.splitMembers.length : 1;
          const expectedShare = (rec.amount || bill.estimate) / denom;
          const result = await readProofImage(base64, 'image/jpeg');
          const matched = result.amount && Math.abs(result.amount - expectedShare) < 1000;
          if (matched) {
            // Clean receipt match — trusted immediately, no extra confirmation needed.
            rec.payments[member] = { status: 'paid', amount: result.amount, uploadedAt: Date.now(), proofImage: dataUrl };
            if (bill.type === 'single' && !bill.tenor) rec.amount = result.amount;
            maybeAdvanceInstallment(bill, rec);
          } else {
            // Couldn't auto-verify — uploader can self-declare, which then needs PJ confirmation.
            rec.payments[member] = { status: 'review', amount: result.amount, uploadedAt: Date.now(), proofImage: dataUrl };
          }
          const ok = await saveGroup(code, g);
          if (ok) setState({ group: g, expandedBills: [...new Set([...state.expandedBills, billId])] });
        } catch (err) {
          label.textContent = 'Gagal baca, coba lagi';
        }
      };
    });
    // PJ confirms or rejects an awaiting payment
    billList.querySelectorAll('[data-confirmpay]').forEach(el => {
      el.onclick = async () => {
        const [billId, member] = el.dataset.confirmpay.split('|');
        const bill = g.bills.find(x => x.id === billId);
        const rec = getMonthRecord(g, monthKey, billId);
        rec.payments[member] = { ...(rec.payments[member] || {}), status: 'paid' };
        maybeAdvanceInstallment(bill, rec);
        const ok = await saveGroup(code, g);
        if (ok) setState({ group: g, expandedBills: [...new Set([...state.expandedBills, billId])] });
      };
    });
    billList.querySelectorAll('[data-rejectpay]').forEach(el => {
      el.onclick = async () => {
        const [billId, member] = el.dataset.rejectpay.split('|');
        const rec = getMonthRecord(g, monthKey, billId);
        rec.payments[member] = { status: 'unpaid' };
        const ok = await saveGroup(code, g);
        if (ok) setState({ group: g, expandedBills: [...new Set([...state.expandedBills, billId])] });
      };
    });
    // Uploader self-declares "sudah bayar" on a mismatched receipt — sends it to PJ for confirmation.
    // For single-type bills the uploader IS the PJ, so this finalizes as paid immediately instead.
    billList.querySelectorAll('[data-override]').forEach(el => {
      el.onclick = async () => {
        const [billId, member] = el.dataset.override.split('|');
        const bill = g.bills.find(x => x.id === billId);
        const rec = getMonthRecord(g, monthKey, billId);
        if (bill.type === 'split') {
          rec.payments[member] = { ...(rec.payments[member] || {}), status: 'awaiting' };
        } else {
          rec.payments[member] = { ...(rec.payments[member] || {}), status: 'paid' };
          maybeAdvanceInstallment(bill, rec);
        }
        const ok = await saveGroup(code, g);
        if (ok) setState({ group: g, expandedBills: [...new Set([...state.expandedBills, billId])] });
      };
    });
    // View proof toggle
    billList.querySelectorAll('[data-viewproof]').forEach(el => {
      el.onclick = () => {
        const target = document.getElementById('proofImg-' + el.dataset.viewproof);
        if (!target) return;
        const showing = target.style.display !== 'none';
        target.style.display = showing ? 'none' : 'block';
        el.textContent = showing ? 'Lihat bukti' : 'Sembunyikan bukti';
      };
    });
    // Edit nominal
    billList.querySelectorAll('[data-editbill]').forEach(el => {
      el.onclick = () => {
        const billId = el.dataset.editbill;
        const bill = g.bills.find(x => x.id === billId);
        const box = document.getElementById('editBox-' + billId);
        box.innerHTML = `
          <div class="edit-nominal-box">
            <div class="field" style="margin-bottom:8px;">
              <label>Nominal baru</label>
              <input type="text" inputmode="numeric" id="editAmount-${billId}" value="${formatRp(bill.estimate)}">
            </div>
            <div class="row">
              <button class="btn-primary btn-small" id="saveEdit-${billId}">Simpan</button>
              <button class="btn-secondary btn-small" id="cancelEdit-${billId}">Batal</button>
            </div>
          </div>
        `;
        const inp = document.getElementById('editAmount-' + billId);
        inp.oninput = () => applyRupiahLive(inp);
        document.getElementById('saveEdit-' + billId).onclick = async () => {
          const newAmount = parseRupiah(inp.value);
          if (!newAmount || newAmount <= 0) return;
          bill.estimate = newAmount;
          const ok = await saveGroup(code, g);
          if (ok) setState({ group: g });
        };
        document.getElementById('cancelEdit-' + billId).onclick = () => { box.innerHTML = ''; };
      };
    });
  }

  document.getElementById('btnExportExcel').onclick = () => {
    const rows = buildExportRows(g);
    const statusEl = document.getElementById('exportStatus');
    if (!rows.length) { statusEl.innerHTML = '<div class="error" style="margin-top:8px;">Belum ada data untuk diekspor.</div>'; return; }
    if (typeof XLSX === 'undefined') { statusEl.innerHTML = '<div class="error" style="margin-top:8px;">Modul Excel belum siap, coba lagi sebentar.</div>'; return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rekap Tagihan');
    XLSX.writeFile(wb, `${g.name}-rekap.xlsx`);
    statusEl.innerHTML = '';
  };
  document.getElementById('btnExportPdf').onclick = () => {
    const rows = buildExportRows(g);
    const statusEl = document.getElementById('exportStatus');
    if (!rows.length) { statusEl.innerHTML = '<div class="error" style="margin-top:8px;">Belum ada data untuk diekspor.</div>'; return; }
    if (typeof window.jspdf === 'undefined') { statusEl.innerHTML = '<div class="error" style="margin-top:8px;">Modul PDF belum siap, coba lagi sebentar.</div>'; return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14);
    doc.text(`Rekap Tagihan - ${g.name}`, 14, 16);
    doc.setFontSize(10);
    let y = 26;
    doc.text('Bulan', 14, y); doc.text('Tagihan', 55, y); doc.text('Kategori', 110, y); doc.text('Nominal', 160, y);
    y += 5;
    doc.setDrawColor(200); doc.line(14, y, 196, y); y += 6;
    rows.forEach(r => {
      if (y > 280) { doc.addPage(); y = 20; }
      doc.text(String(r.Bulan), 14, y);
      doc.text(String(r.Tagihan), 55, y);
      doc.text(String(r.Kategori), 110, y);
      doc.text(formatRp(r.Nominal), 160, y);
      y += 7;
    });
    doc.save(`${g.name}-rekap.pdf`);
    statusEl.innerHTML = '';
  };

  document.getElementById('btnReminder').onclick = () => {
    const lines = [];
    g.bills.forEach(b => {
      if (isInstallmentDone(b)) return;
      const rec = getMonthRecord(g, monthKey, b.id);
      const req = requiredMembers(b);
      req.filter(m => (rec.payments[m] || {}).status !== 'paid').forEach(m => {
        lines.push(`- ${m} belum bayar bagian "${b.name}"${b.type === 'split' ? ' (transfer ke ' + b.responsible + ')' : ''}`);
      });
    });
    const text = lines.length
      ? `Pengingat tagihan ${g.name} bulan ${monthLabel()}:\n${lines.join('\n')}`
      : `Semua tagihan bulan ${monthLabel()} sudah beres. Mantap!`;
    document.getElementById('reminderOut').innerHTML = `<div class="reminder-box">${text}</div><button class="btn-ghost" id="btnCopy">Salin teks</button>`;
    document.getElementById('btnCopy').onclick = () => { navigator.clipboard.writeText(text); document.getElementById('btnCopy').textContent = 'Tersalin!'; };
  };
}

function renderMemberRow(g, bill, rec, member, share) {
  const p = rec.payments[member] || { status: 'unpaid' };
  const roleLabel = bill.type === 'split' ? `${member} (transfer ke ${bill.responsible})` : member;
  const isPJ = state.currentUser === bill.responsible;
  let actionHtml;
  if (p.status === 'paid') {
    actionHtml = `<span class="settle-toggle on">Lunas</span>`;
  } else if (p.status === 'awaiting') {
    if (isPJ) {
      actionHtml = `<button type="button" class="btn-ghost" data-confirmpay="${bill.id}|${member}" style="font-size:12px;padding:2px 6px;color:var(--success);">Konfirmasi lunas</button><button type="button" class="btn-ghost" data-rejectpay="${bill.id}|${member}" style="font-size:12px;padding:2px 6px;color:var(--danger);">Tolak</button>`;
    } else {
      actionHtml = `<span class="settle-toggle review">Menunggu konfirmasi ${bill.responsible}</span>`;
    }
  } else if (p.status === 'review') {
    if (bill.type === 'split') {
      actionHtml = `<span class="settle-toggle review">Perlu dicek</span>${state.currentUser === member ? `<button type="button" class="btn-ghost" data-override="${bill.id}|${member}" style="font-size:12px;padding:2px 4px;">Tandai sudah bayar</button>` : ''}`;
    } else {
      actionHtml = `<span class="settle-toggle review">Perlu cek</span>${isPJ ? `<button type="button" class="btn-ghost" data-override="${bill.id}|${member}" style="font-size:12px;padding:2px 4px;">Tandai valid</button>` : ''}`;
    }
  } else {
    actionHtml = `<label class="settle-toggle" style="cursor:pointer;">Upload bukti<input type="file" accept="image/*" data-upload="${bill.id}|${member}" style="display:none;"></label>`;
  }

  const canView = (state.currentUser === member || state.currentUser === bill.responsible) && p.proofImage;
  const proofId = bill.id + '_' + member;
  const ocrNote = p.status === 'awaiting' && p.ocrMatched === false ? `<div class="awaiting-note">AI membaca nominal beda dari yang diharapkan — cek manual sebelum konfirmasi.</div>` : '';

  return `
    <div class="split-row">
      <div class="split-row-top">
        <span class="sname">${roleLabel} · ${formatRp(share)}</span>
        ${actionHtml}
      </div>
      ${ocrNote}
      ${canView ? `<button type="button" class="proof-link" data-viewproof="${proofId}">Lihat bukti</button><span style="font-size:11px;color:var(--ink-faint);margin-left:6px;">Diupload ${formatDateTime(p.uploadedAt)}</span><img id="proofImg-${proofId}" class="proof-img" src="${p.proofImage}" style="display:none;">` : ''}
    </div>
  `;
}

// ---------- Init ----------
async function init() {
  if (typeof window.storage === 'undefined' || !window.storage) {
    state.view = 'storageError';
    render();
    return;
  }
  state.view = 'register';
  render();
}
init();
</script>
</body>
</html>
